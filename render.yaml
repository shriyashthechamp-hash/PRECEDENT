# ==============================================================
# PRECEDENT — Render Cloud Infrastructure Blueprint
# Deploys:
#   1. precedent-api (FastAPI Python Web Service)
#   2. precedent-db (Render Managed PostgreSQL Database)
# ==============================================================

services:
  - type: web
    name: precedent-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Database connection: automatically injected from precedent-db below
      - key: DATABASE_URL
        fromDatabase:
          name: precedent-db
          property: connectionString
      # Groq AI Inference credentials (enter in Render Dashboard)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      # Hindsight Biomimetic Memory configuration
      - key: HINDSIGHT_API_URL
        value: http://localhost:8888
      - key: HINDSIGHT_BANK_ID
        value: precedent-institutional-memory
      # Production CORS: enter your Vercel URL (e.g. https://precedent-ui.vercel.app)
      - key: CORS_ORIGINS
        sync: false
      # Cryptographic security key: auto-generated by Render
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: precedent-db
    databaseName: precedent
    user: precedent
    plan: free
    region: oregon

